name: Update SBS M3U

on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install requests
        run: |
          pip install requests

      - name: Generate M3U
        run: |
          python generate.py

      - name: Check changes
        id: changes
        run: |
          if git status --porcelain -- korea.m3u | grep -q .; then
            echo "changed=true" >> $GITHUB_OUTPUT
            echo "korea.m3u 변경됨"
          else
            echo "changed=false" >> $GITHUB_OUTPUT
            echo "korea.m3u 변경사항 없음"
          fi

      - name: Commit and Push
        if: steps.changes.outputs.changed == 'true'
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add korea.m3u
          git commit -m "Update SBS M3U"
          git pull --rebase origin main
          git push origin main